# Checks each pull request. A merge to main reaches every machine, so main accepts only a PR that passes.
# pull_request (not pull_request_target) runs fork code with a read-only token and no secrets.
name: Check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Toolkit tests
        run: python3 tests/check.py
      - name: Claude Code plugin validation
        run: |
          npm install -g @anthropic-ai/claude-code@2.1.319
          claude plugin validate .
          claude plugin validate plugin
      - name: Install script syntax
        run: sh -n install.sh

  # Runs the installers from GitHub, on this PR's branch, in the runner's empty home.
  install:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      TOOLKIT_REPO: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
      TOOLKIT_REF: ${{ github.head_ref || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Claude Code and Codex
        run: npm install -g @anthropic-ai/claude-code@2.1.319 @openai/codex@0.167.0
      - name: Plain install (Linux)
        if: runner.os == 'Linux'
        run: sh install.sh && python3 tests/check_install.py
      - name: Personal install (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p ~/.config/toolkit && cp personal/env.example ~/.config/toolkit/env
          sh install.sh --personal && python3 tests/check_install.py --personal
      - name: Plain install (Windows PowerShell 5.1)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          .\install.ps1
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python tests/check_install.py
      - name: Personal install (Windows PowerShell 5.1)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          .\install.ps1 -Personal
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python tests/check_install.py --personal
